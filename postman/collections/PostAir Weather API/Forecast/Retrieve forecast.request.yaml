$kind: http-request
description: Returns a list of forecasts
url: "{{baseUrl}}/forecast?forecastCity=Atlanta"
method: GET
headers:
  Accept: application/json
queryParams:
  forecastCity: Atlanta
scripts:
  - type: afterResponse
    code: |
      // --- Baseline: Status & Performance ---
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response time is under 2000ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(2000);
      });

      pm.test("Content-Type is application/json", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });

      // --- Baseline: Top-level Response Fields ---
      const responseData = pm.response.json();

      pm.test("Response body is an array", function () {
          pm.expect(responseData).to.be.an("array");
      });

      pm.test("Response array has at least one item", function () {
          pm.expect(responseData.length).to.be.above(0);
      });

      pm.test("Each item contains all expected top-level fields", function () {
          responseData.forEach(function (item) {
              pm.expect(item).to.have.all.keys(
                  "id", "city", "country", "humidity", "windSpeed",
                  "weatherCondition", "sunriseTime", "sunsetTime",
                  "visibility", "airPressure", "temperature", "turbulenceLevel"
              );
          });
      });

      // ─── 1. Status & Response Basics ───────────────────────────────────────────

      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response time is under 3000ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(3000);
      });

      pm.test("Content-Type header is application/json", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });

      // ─── 2. Response Structure ──────────────────────────────────────────────────

      pm.test("Response body is an array", function () {
          pm.expect(responseData).to.be.an("array");
      });

      pm.test("Array has at least one item", function () {
          pm.expect(responseData).to.have.length.above(0);
      });

      pm.test("Each item has the required fields", function () {
          const requiredFields = [
              "id", "city", "country", "humidity", "windSpeed",
              "weatherCondition", "sunriseTime", "sunsetTime",
              "visibility", "airPressure", "temperature", "turbulenceLevel"
          ];
          responseData.forEach(function (item) {
              requiredFields.forEach(function (field) {
                  pm.expect(item, `Item is missing field: ${field}`).to.have.property(field);
              });
          });
      });

      // ─── 3. Field Type Validation ───────────────────────────────────────────────

      pm.test("id is a string", function () {
          responseData.forEach(function (item) {
              pm.expect(item.id).to.be.a("string");
          });
      });

      pm.test("city is a string", function () {
          responseData.forEach(function (item) {
              pm.expect(item.city).to.be.a("string");
          });
      });

      pm.test("country is a string", function () {
          responseData.forEach(function (item) {
              pm.expect(item.country).to.be.a("string");
          });
      });

      pm.test("humidity is a number between 0 and 100", function () {
          responseData.forEach(function (item) {
              pm.expect(item.humidity).to.be.a("number");
              pm.expect(item.humidity).to.be.at.least(0);
              pm.expect(item.humidity).to.be.at.most(100);
          });
      });

      pm.test("windSpeed is an array with at least one item", function () {
          responseData.forEach(function (item) {
              pm.expect(item.windSpeed).to.be.an("array").with.length.above(0);
          });
      });

      pm.test("Each windSpeed item has Speed (number), unit (string), direction (string)", function () {
          responseData.forEach(function (item) {
              item.windSpeed.forEach(function (ws) {
                  pm.expect(ws.Speed).to.be.a("number");
                  pm.expect(ws.unit).to.be.a("string");
                  pm.expect(ws.direction).to.be.a("string");
              });
          });
      });

      pm.test("weatherCondition is a string and not empty", function () {
          responseData.forEach(function (item) {
              pm.expect(item.weatherCondition).to.be.a("string").and.to.have.length.above(0);
          });
      });

      pm.test("sunriseTime is a string matching time format (contains AM or PM)", function () {
          responseData.forEach(function (item) {
              pm.expect(item.sunriseTime).to.be.a("string");
              pm.expect(item.sunriseTime).to.match(/AM|PM/i);
          });
      });

      pm.test("sunsetTime is a string matching time format (contains AM or PM)", function () {
          responseData.forEach(function (item) {
              pm.expect(item.sunsetTime).to.be.a("string");
              pm.expect(item.sunsetTime).to.match(/AM|PM/i);
          });
      });

      pm.test("visibility is a number greater than 0", function () {
          responseData.forEach(function (item) {
              pm.expect(item.visibility).to.be.a("number").and.to.be.above(0);
          });
      });

      pm.test("airPressure is a number greater than 0", function () {
          responseData.forEach(function (item) {
              pm.expect(item.airPressure).to.be.a("number").and.to.be.above(0);
          });
      });

      pm.test("temperature is an array with at least one item", function () {
          responseData.forEach(function (item) {
              pm.expect(item.temperature).to.be.an("array").with.length.above(0);
          });
      });

      pm.test("Each temperature item has temperature (number) and temperatureUnit (string)", function () {
          responseData.forEach(function (item) {
              item.temperature.forEach(function (t) {
                  pm.expect(t.temperature).to.be.a("number");
                  pm.expect(t.temperatureUnit).to.be.a("string");
              });
          });
      });

      pm.test("turbulenceLevel is a string and not empty", function () {
          responseData.forEach(function (item) {
              pm.expect(item.turbulenceLevel).to.be.a("string").and.to.have.length.above(0);
          });
      });

      // ─── 4. Business Logic ──────────────────────────────────────────────────────

      pm.test("Sunrise time is not the same as sunset time", function () {
          responseData.forEach(function (item) {
              pm.expect(item.sunriseTime).to.not.equal(item.sunsetTime);
          });
      });

      pm.test("Humidity is a realistic value (between 0 and 100)", function () {
          responseData.forEach(function (item) {
              pm.expect(item.humidity).to.be.at.least(0);
              pm.expect(item.humidity).to.be.at.most(100);
          });
      });

      pm.test("Wind speed value is non-negative", function () {
          responseData.forEach(function (item) {
              item.windSpeed.forEach(function (ws) {
                  pm.expect(ws.Speed).to.be.at.least(0);
              });
          });
      });

      pm.test("Visibility is a positive number", function () {
          responseData.forEach(function (item) {
              pm.expect(item.visibility).to.be.above(0);
          });
      });

      pm.test("Air pressure is within realistic range (900–1100 hPa)", function () {
          responseData.forEach(function (item) {
              pm.expect(item.airPressure).to.be.at.least(900);
              pm.expect(item.airPressure).to.be.at.most(1100);
          });
      });
    language: text/javascript
settings: {}
examples: ./.resources/Retrieve forecast.resources/examples
order: 1000
