$kind: http-request
description: Returns a list of METAR reports
url: "{{baseUrl}}/metars?airportCode=ATL"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: airportCode
    value: ATL
    description: airport code
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "default": "ATL",
            "minLength": 3,
            "maxLength": 4,
            "pattern": "^[A-Z]{3,4}$"
          }
        }
      }
scripts:
  - type: afterResponse
    code: |-
      const time = pm.response.responseTime;
      const name = pm.info.requestName;

      if (time>100){
          console.warn(
              `[SLOW] ${name}: ${time}ms exceeds soft limit`
          );
      }
      pm.test("Response time is under 500ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(500);
      });

      pm.test("Response size is under 10KB", () =>
      {
          const sizeKB = pm.response.responseSize / 1024;
          pm.expect(sizeKB).to.be.below(10);
      })

      pm.test("Content-Type is application/json", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });

      // --- Baseline: Response Body Structure ---
      const responseData = pm.response.json();

      pm.test("Response body is an array", function () {
          pm.expect(responseData).to.be.an("array");
      });

      pm.test("Response array has at least one item", function () {
          pm.expect(responseData.length).to.be.above(0);
      });

      pm.test("Each item contains top-level field: code", function () {
          responseData.forEach(function (item) {
              pm.expect(item).to.have.property("code");
              pm.expect(item.code).to.be.a("string");
          });
      });

      pm.test("Each item contains top-level field: name", function () {
          responseData.forEach(function (item) {
              pm.expect(item).to.have.property("name");
              pm.expect(item.name).to.be.a("string");
          });
      });

      pm.test("Each item contains top-level field: metar", function () {
          responseData.forEach(function (item) {
              pm.expect(item).to.have.property("metar");
              pm.expect(item.metar).to.be.an("object");
          });
      });

      pm.test("Each metar contains: raw, time, wind, visibility, clouds, temperature, dewpoint, altimeter", function () {
          responseData.forEach(function (item) {
              pm.expect(item.metar).to.have.all.keys(
                  "raw", "time", "wind", "visibility", "clouds",
                  "temperature", "dewpoint", "altimeter"
              );
          });
      });
    language: text/javascript
settings: {}
examples: ./.resources/Retrieve METAR report.resources/examples
order: 1000
