$kind: http-request
description: Returns a list of turbulence reports
url: "{{baseUrl}}/turbulence?airportCode=ATL"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: airportCode
    value: ATL
    description: airport code
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "default": "ATL",
            "minLength": 3,
            "maxLength": 4,
            "pattern": "^[A-Z]{3,4}$"
          }
        }
      }
scripts:
  - type: afterResponse
    code: |
      // --- Baseline: Status & Performance ---
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response time is under 2000ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(2000);
      });

      pm.test("Content-Type is application/json", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });

      // --- Baseline: Response Body Structure ---
      const responseData = pm.response.json();

      pm.test("Response body is an array", function () {
          pm.expect(responseData).to.be.an("array");
      });

      pm.test("Response array has at least one item", function () {
          pm.expect(responseData.length).to.be.above(0);
      });

      pm.test("Each item contains top-level field: airport", function () {
          responseData.forEach(function (item) {
              pm.expect(item).to.have.property("airport");
              pm.expect(item.airport).to.be.an("object");
          });
      });

      pm.test("Each item contains top-level field: turbulenceReport", function () {
          responseData.forEach(function (item) {
              pm.expect(item).to.have.property("turbulenceReport");
              pm.expect(item.turbulenceReport).to.be.an("object");
          });
      });
    language: text/javascript
settings: {}
examples: ./.resources/Retrieve turbulence report.resources/examples
order: 1000
