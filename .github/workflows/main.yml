name: PostAir API Tests
on:
  push:
    branches:
      - main
    pull_request:
      branches:
        -main
jobs:
  run-api-tests:
    run-api-tests:
      runs-on: ubuntu-latest
      steps:
        - name: Install Postman CLI
        run: curl -o- "https://dl-cli.pstmn.io/install/lunix64.sh" | sh
        - name: Login to Postman
        run: postman login --with-api-key ${{ secrets.POSTMAN_API_KEY }}
        - name : Run PostAIR test suite
        run: postman collection run 54081815-2bdc5440-a39b-40d8-be64-6acc314975df -e 54081815-7fdeb79a-55c6-496f-b299-4c6f9fbf5a5f
  
